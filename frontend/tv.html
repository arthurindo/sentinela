<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sistema Hospitalar - TV</title>

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, Helvetica, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a, #1e293b);

            display: flex;
            justify-content: center;
            align-items: center;

            width: 100vw;
            height: 100vh;

            overflow: hidden;
        }


        /* =========================================
           CONTAINER PRINCIPAL
        ========================================= */

        .tv-container {
            display: flex;

            width: 95vw;
            height: 90vh;

            gap: 18px;
        }


        /* =========================================
           PAINÉIS
        ========================================= */

        .left-panel,
        .right-panel {

            display: flex;
            flex-direction: column;

            width: 50%;

            gap: 18px;
        }


        /* =========================================
           CAIXAS
        ========================================= */

        .box {

            position: relative;

            background: #ffffff;

            border: none;
            border-radius: 16px;

            padding: 20px;

            display: flex;
            flex-direction: column;

            justify-content: center;
            align-items: center;

            text-align: center;

            box-shadow:
                0 10px 30px rgba(0, 0, 0, 0.18),
                0 2px 8px rgba(0, 0, 0, 0.08);

            overflow: hidden;
        }


        /* Barra superior */

        .box::before {

            content: "";

            position: absolute;

            top: 0;
            left: 0;

            width: 100%;
            height: 6px;

            background: linear-gradient(
                90deg,
                #0ea5a8,
                #2563eb
            );
        }


        /* =========================================
           TÍTULOS
        ========================================= */

        .box-title {

            color: #334155;

            font-size: 2.2vw;

            font-weight: 700;

            text-transform: uppercase;

            letter-spacing: 1px;

            margin-bottom: 12px;
        }


        /* =========================================
           LOCAL
        ========================================= */

        .local-box {
            flex: 1;
        }


        .local-number {

            color: #dc2626;

            font-size: 9vw;

            font-weight: 800;

            line-height: 1;

            text-shadow:
                0 3px 8px rgba(220, 38, 38, 0.15);
        }


        .local-type {

            color: #64748b;

            font-size: 1.8vw;

            font-weight: 700;

            margin-top: 8px;

            text-transform: uppercase;
        }


        /* =========================================
           HISTÓRICO
        ========================================= */

        .history-box {

            flex: 1;

            justify-content: flex-start;
            align-items: flex-start;

            padding-top: 25px;
        }


        .history-box .box-title {

            width: 100%;

            font-size: 1.8vw;

            text-align: center;
        }


        #history-list {

            list-style: none;

            width: 100%;

            color: #475569;

            font-size: 1.5vw;

            font-weight: 600;

            text-align: left;

            margin-top: 5px;
        }


        #history-list li {

            display: flex;

            align-items: center;

            min-height: 40px;

            margin-bottom: 8px;

            padding: 7px 10px;

            border-bottom: 1px solid #e2e8f0;

            color: #475569;
        }


        /* =========================================
           PACIENTE
        ========================================= */

        .patient-box {

            flex: 3;

            background:
                linear-gradient(
                    145deg,
                    #ffffff,
                    #f8fafc
                );
        }


        .patient-name {

            color: #dc2626;

            font-size: 6.5vw;

            font-weight: 800;

            line-height: 1.15;

            word-break: break-word;

            text-shadow:
                0 3px 10px rgba(220, 38, 38, 0.12);

            max-width: 100%;
        }


        /* =========================================
           LOGO
        ========================================= */

        .logo-box {

            flex: 1;

            width: 100%;

            min-height: 0;

            background: linear-gradient(
                145deg,
                #f8fafc,
                #eef4f8
            );

            display: flex;

            flex-direction: column;

            justify-content: center;

            align-items: center;

            padding: 20px;

            overflow: hidden;
        }


        /* Texto + imagem */

        .logo-text {

            width: 100%;

            display: flex;

            flex-direction: row;

            justify-content: center;

            align-items: center;

            gap: 20px;

            color: #2563eb;

            font-size: 2.2vw;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 1px;

            text-align: center;
        }


        /* Imagem da logo */

        .logo-text img {

            display: block;

            width: 180px;

            height: 100px;

            object-fit: contain;

            background: #ffffff;

            padding: 8px;

            border-radius: 12px;

            border: 2px solid #e2e8f0;

            box-shadow:
                0 6px 18px rgba(0, 0, 0, 0.12);
        }


        /* =========================================
           ANIMAÇÃO DA CHAMADA
        ========================================= */

        @keyframes flash {

            0%,
            100% {

                opacity: 1;

                transform: scale(1);
            }

            50% {

                opacity: 0.35;

                transform: scale(1.02);
            }
        }


        .flash {

            animation: flash 0.5s ease 3;
        }


        /* =========================================
           RESPONSIVIDADE
        ========================================= */

        @media (max-width: 900px) {

            .tv-container {

                width: 96vw;

                height: 92vh;

                gap: 12px;
            }


            .box {

                border-radius: 12px;

                padding: 15px;
            }


            .box-title {

                font-size: 3vw;
            }


            .history-box .box-title {

                font-size: 2.5vw;
            }


            #history-list {

                font-size: 2vw;
            }


            .local-number {

                font-size: 11vw;
            }


            .local-type {

                font-size: 2.5vw;
            }


            .patient-name {

                font-size: 7vw;
            }


            .logo-text {

                font-size: 4vw;

                gap: 12px;
            }


            .logo-text img {

                width: 150px;

                height: 85px;
            }
        }


        /* =========================================
           TELAS PEQUENAS
        ========================================= */

        @media (max-width: 600px) {

            body {

                overflow: auto;
            }


            .tv-container {

                flex-direction: column;

                width: 94vw;

                height: auto;

                min-height: 95vh;
            }


            .left-panel,
            .right-panel {

                width: 100%;
            }


            .local-number {

                font-size: 18vw;
            }


            .patient-name {

                font-size: 10vw;
            }


            .box-title {

                font-size: 5vw;
            }


            .history-box .box-title {

                font-size: 4vw;
            }


            #history-list {

                font-size: 3.5vw;
            }


            .local-type {

                font-size: 4vw;
            }


            .logo-text {

                font-size: 6vw;

                flex-direction: column;

                gap: 10px;
            }


            .logo-text img {

                width: 200px;

                height: 110px;
            }
        }

    </style>

</head>


<body>

    <div class="tv-container">


        <!-- =====================================
             PAINEL ESQUERDO
        ====================================== -->

        <div class="left-panel">


            <!-- LOCAL / GUICHÊ -->

            <div class="box local-box">

                <div
                    class="box-title"
                    id="local-tipo"
                >
                    GUICHÊ
                </div>


                <div
                    class="local-number"
                    id="local-numero"
                >
                    --
                </div>

            </div>


            <!-- HISTÓRICO -->

            <div class="box history-box">

                <div class="box-title">
                    ÚLTIMAS CHAMADAS
                </div>


                <ul id="history-list"></ul>

            </div>

        </div>


        <!-- =====================================
             PAINEL DIREITO
        ====================================== -->

        <div class="right-panel">


            <!-- PACIENTE -->

            <div class="box patient-box">

                <div class="box-title">
                    PACIENTE
                </div>


                <div
                    class="patient-name"
                    id="patient-name"
                >
                    AGUARDANDO...
                </div>

            </div>


            <!-- LOGO -->

            

                <div class="logo-text">

                    <span>
                        SISTEMA HOSPITALAR
                    </span>


                    <img
                        src="./image/logo.png"
                        alt="Logo do Sistema Hospitalar"
                    >

                </div>

            
        </div>

    </div>


    <!-- =========================================
         JAVASCRIPT
    ========================================== -->

    <script>

        let ultimold = null;


        // =========================================
        // ATUALIZAR TV
        // =========================================

        async function atualizar() {

            try {

                const resposta =
                    await fetch("/tv/chamada");


                if (!resposta.ok) {

                    throw new Error(
                        `HTTP ${resposta.status}`
                    );
                }


                const data =
                    await resposta.json();


                const chamada =
                    data.chamada;


                const historico =
                    data.historico || [];


                // =================================
                // CHAMADA ATUAL
                // =================================

                if (chamada) {


                    document.getElementById(
                        "local-tipo"
                    ).innerText =
                        chamada.localTipo ||
                        "GUICHÊ";


                    document.getElementById(
                        "local-numero"
                    ).innerText =
                        chamada.localNumero ||
                        "--";


                    document.getElementById(
                        "patient-name"
                    ).innerText =
                        chamada.paciente ||
                        "AGUARDANDO...";


                    // Nova chamada

                    if (
                        chamada.id !==
                        ultimold
                    ) {

                        ultimold =
                            chamada.id;


                        const pacienteBox =
                            document.querySelector(
                                ".patient-box"
                            );


                        if (pacienteBox) {

                            pacienteBox.classList.remove(
                                "flash"
                            );


                            // Força atualização
                            // da animação

                            void pacienteBox.offsetWidth;


                            pacienteBox.classList.add(
                                "flash"
                            );
                        }
                    }


                } else {


                    document.getElementById(
                        "local-tipo"
                    ).innerText =
                        "GUICHÊ";


                    document.getElementById(
                        "local-numero"
                    ).innerText =
                        "--";


                    document.getElementById(
                        "patient-name"
                    ).innerText =
                        "AGUARDANDO...";
                }


                // =================================
                // HISTÓRICO
                // =================================

                const list =
                    document.getElementById(
                        "history-list"
                    );


                list.innerHTML = "";


                historico
                    .slice(0, 4)
                    .forEach(h => {


                        const li =
                            document.createElement(
                                "li"
                            );


                        const tipo =
                            h.localTipo
                                ? h.localTipo.substring(
                                    0,
                                    4
                                )
                                : "GUIC";


                        li.innerText =
                            `${tipo}. ${
                                h.localNumero || "--"
                            } - ${
                                h.paciente || ""
                            }`;


                        list.appendChild(li);

                    });


            } catch (err) {

                console.error(
                    "Erro ao buscar chamada:",
                    err
                );
            }
        }


        // =========================================
        // PRIMEIRA ATUALIZAÇÃO
        // =========================================

        atualizar();


        // =========================================
        // ATUALIZA A CADA 2 SEGUNDOS
        // =========================================

        setInterval(
            atualizar,
            2000
        );

    </script>

</body>

</html>
