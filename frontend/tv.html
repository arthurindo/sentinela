<!DOCTYPE html>
<html lang="en">

<head>

    <style>
        * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    font-family: Arial, Helvetica, sans-serif;
}

body {
    background: linear-gradient(135deg, #0f172a, #1e293b);

    display: flex;
    justify-content: center;
    align-items: center;

    width: 100vw;
    height: 100vh;

    overflow: hidden;
}


/* =========================================
   CONTAINER PRINCIPAL
========================================= */

.tv-container {
    display: flex;

    width: 95vw;
    height: 90vh;

    gap: 18px;
}


/* =========================================
   PAINÉIS
========================================= */

.left-panel,
.right-panel {
    display: flex;
    flex-direction: column;

    width: 50%;

    gap: 18px;
}


/* =========================================
   CAIXAS
========================================= */

.box {
    position: relative;

    background: #ffffff;

    border: none;
    border-radius: 16px;

    padding: 20px;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    text-align: center;

    box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.18),
        0 2px 8px rgba(0, 0, 0, 0.08);

    overflow: hidden;
}


/* Barra superior decorativa */
.box::before {
    content: "";

    position: absolute;

    top: 0;
    left: 0;

    width: 100%;
    height: 6px;

    background: linear-gradient(
        90deg,
        #0ea5a8,
        #2563eb
    );
}


/* =========================================
   TÍTULOS
========================================= */

.box-title {
    color: #334155;

    font-size: 2.2vw;

    font-weight: 700;

    text-transform: uppercase;

    letter-spacing: 1px;

    margin-bottom: 12px;

    text-shadow: none;
}


/* =========================================
   LOCAL / GUICHÊ / CONSULTÓRIO
========================================= */

.local-box {
    flex: 1;
}


/* Número do local */
.local-number {
    color: #dc2626;

    font-size: 9vw;

    font-weight: 800;

    line-height: 1;

    text-shadow:
        0 3px 8px rgba(220, 38, 38, 0.15);
}


/* Tipo do local */
.local-type {
    color: #64748b;

    font-size: 1.8vw;

    font-weight: 700;

    margin-top: 8px;

    text-transform: uppercase;
}


/* =========================================
   HISTÓRICO
========================================= */

.history-box {
    flex: 1;

    justify-content: flex-start;
    align-items: flex-start;

    padding-top: 25px;
}


.history-box .box-title {
    width: 100%;

    font-size: 1.8vw;

    text-align: center;
}


/* Lista */
#history-list {
    list-style: none;

    width: 100%;

    color: #475569;

    font-size: 1.5vw;

    font-weight: 600;

    text-align: left;

    margin-top: 5px;
}


/* Itens do histórico */
#history-list li {
    display: flex;
    align-items: center;

    min-height: 40px;

    margin-bottom: 8px;

    padding: 7px 10px;

    border-bottom: 1px solid #e2e8f0;

    color: #475569;
}


/* =========================================
   PACIENTE CHAMADO
========================================= */

.patient-box {
    flex: 3;

    background:
        linear-gradient(
            145deg,
            #ffffff,
            #f8fafc
        );
}


/* Nome do paciente */
.patient-name {
    color: #dc2626;

    font-size: 6.5vw;

    font-weight: 800;

    line-height: 1.15;

    word-break: break-word;

    text-shadow:
        0 3px 10px rgba(220, 38, 38, 0.12);

    max-width: 100%;
}


/* =========================================
   LOGO
========================================= */

/* =========================================
   ÁREA DA LOGO / FOTO
========================================= */

.logo-box {
    flex: 1;

    width: 100%;
    min-height: 0;

    background: linear-gradient(
        145deg,
        #f8fafc,
        #eef4f8
    );

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    padding: 20px;

    overflow: hidden;
}


/* Texto da logo */
.logo-text {
    width: 100%;

    display: flex;
    flex-direction: column;

    justify-content: center;
    align-items: center;

    gap: 15px;

    color: #2563eb;

    font-size: 2.2vw;
    font-weight: 800;

    text-transform: uppercase;
    letter-spacing: 1px;

    text-align: center;
}


/* FOTO / LOGO */
.logo-text img {
    display: block;

    width: 220px;
    height: 120px;

    object-fit: contain;

    background: #ffffff;

    padding: 10px;

    border-radius: 12px;

    border: 2px solid #e2e8f0;

    box-shadow:
        0 5px 15px rgba(15, 23, 42, 0.10);
}


/* =========================================
   ANIMAÇÃO DE CHAMADA
========================================= */

@keyframes flash {

    0%,
    100% {
        opacity: 1;
        transform: scale(1);
    }

    50% {
        opacity: 0.35;
        transform: scale(1.02);
    }
}


.flash {
    animation: flash 0.5s ease 3;
}


/* =========================================
   RESPONSIVIDADE
========================================= */

@media (max-width: 900px) {

    .tv-container {
        width: 96vw;
        height: 92vh;

        gap: 12px;
    }

    .box {
        border-radius: 12px;
        padding: 15px;
    }

    .box-title {
        font-size: 3vw;
    }

    .history-box .box-title {
        font-size: 2.5vw;
    }

    #history-list {
        font-size: 2vw;
    }

    .local-number {
        font-size: 11vw;
    }

    .local-type {
        font-size: 2.5vw;
    }

    .patient-name {
        font-size: 7vw;
    }

    .logo-text {
        font-size: 4vw;
    }
}


/* =========================================
   TELAS PEQUENAS
========================================= */

@media (max-width: 600px) {

    body {
        overflow: auto;
    }

    .tv-container {
        flex-direction: column;

        width: 94vw;
        height: auto;

        min-height: 95vh;
    }

    .left-panel,
    .right-panel {
        width: 100%;
    }

    .local-number {
        font-size: 18vw;
    }

    .patient-name {
        font-size: 10vw;
    }

    .box-title {
        font-size: 5vw;
    }

    .history-box .box-title {
        font-size: 4vw;
    }

    #history-list {
        font-size: 3.5vw;
    }

    .local-type {
        font-size: 4vw;
    }

    .logo-text {
        font-size: 6vw;
    }
}

.logo-text img {
    width: 320px;
    height: 180px;

    object-fit: contain;

    background: #fff;

    padding: 12px;

    border-radius: 14px;

    border: 2px solid #e2e8f0;

    box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
}



    </style>


    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Midia Indoor- TV</title>

</head>

<body>

    <div class="tv-container">

        <div class="left-panel">

            <div class="box local-box">

                <div class="box-title" id="local-tipo">
                    GUIGHÊ
                </div>

                <div class="local-number" id="local-numero">
                    --
                </div>

            </div>


            <div class="box history-box">

                <div class="box-title">
                    ÚLTIMAS CHAMADAS
                </div>

                <ul id="history-list"></ul>

            </div>

        </div>


        <div class="right-panel">

            <div class="box patient-box">

                <div class="box-title">
                    PACIENTE
                </div>

                <div class="patient-name" id="patient-name">
                    AGUARDANDO...
                </div>

            </div>


            <div class="box logo-box">

                <div class="logo-text">
                    🏥Sistema hospitalar
                    <img style="position: relative; height: 100px;" src="/image/logo.png" alt="">
                </div>
            </div>
        </div>
    </div>

    <script>
        let ultimold =null
        //Função criada para buscar a chamada atual e o historico da TV em tempo real //
        function atualizar(){
            fetch("/tv/chamada")
                .then(r=>r.json())
                .then(data => {
                    const chamada = data.chamada
                    const historico= data.historico ||  [];
                
                if(chamada){
                    document.getElementById("local-tipo").innerText = chamada.localTipo || "GUICHÊ"
                    document.getElementById("local-numero").innerText = chamada.localNumero || "--"
                    document.getElementById("local-name").innerText = chamada.paciente || "AGUARDANDO..."
                    //Flash visual quanto ha chamada nova//
                    if(chamada.id !==ultimold){
                        ultimold=chamada.id;
                        const pacienteBox = document.querySelector(".pacient-box")
                        pacienteBox.classList.remove("flash")
                        void pacienteBox.offsetwidth; //reflow
                        pacienteBox.classList.add("flash")
                    }
                }
                //Historico

                const list = document.getElementById("history-list")
                list.innerText = "";
                historico.slice(0, 4).forEach(h => {
                    const li =document.create("li")
                    const tipo = h.localTipo ? h.localTipo.substring(0, 4) : "GUIC"
                    li.innerText = `${tipo}. ${h.localNumero} - ${h.paciente}`
                    list.appendChild(li);   
                });
          })
          .catch(err => console.log("Erro em buscar chamada", err));

        }

        //Polling a cada 2 segundos
        atualizar()
        setInterval(atualizar,2000) 

        
    </script>

</body>

</html>
