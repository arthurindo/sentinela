<!DOCTYPE html>
<html lang="pt-br">

<head>

<meta charset="UTF-8">

<title>Triagem Hospitalar</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}


body{

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:30px;

    font-family:'Cinzel',serif;

    background:

    linear-gradient(
    rgba(15,8,0,.82),
    rgba(15,8,0,.82)
    ),

    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;

    background-position:center;

    color:#f5deb3;

}


.container{

    width:450px;

    background:rgba(35,18,8,.92);

    border:3px solid #8b5a2b;

    border-radius:10px;

    padding:35px;

    box-shadow:

    0 0 40px rgba(0,0,0,.8),

    inset 0 0 20px rgba(255,190,60,.08);

}


h2{

    text-align:center;

    color:#f6d28d;

    font-size:32px;

    margin-bottom:25px;

    text-shadow:2px 2px 5px black;

    letter-spacing:2px;

}


input,
select,
textarea{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    background:#3b2415;

    color:#f6dfb0;

    border:2px solid #8b5a2b;

    border-radius:6px;

    font-family:inherit;

    outline:none;

}


input::placeholder,
textarea::placeholder{

    color:#d8bc88;

}


input:focus,
select:focus,
textarea:focus{

    border-color:#d4af37;

    box-shadow:0 0 10px rgba(212,175,55,.5);

}


textarea{

    height:120px;

    resize:none;

}


button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:6px;

    background:

    linear-gradient(
    #d4aa55,
    #8b5a2b
    );

    color:#2b1608;

    font-family:inherit;

    font-size:17px;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    transition:.3s;

}


button:hover{

    transform:translateY(-3px);

    box-shadow:

    0 0 20px rgba(255,190,60,.5);

}


#resultado{

    text-align:center;

    margin-bottom:20px;

    padding:15px;

    border-radius:6px;

    font-size:20px;

    font-weight:bold;

    display:none;

}


/* Classificação de risco */

.verde{

    display:block !important;

    background:#245c2a;

    color:#a8ffb0;

    border:2px solid #4caf50;

}


.amarelo{

    display:block !important;

    background:#6b5200;

    color:#ffe98a;

    border:2px solid #ffd740;

}


.vermelho{

    display:block !important;

    background:#641b1b;

    color:#ffb0b0;

    border:2px solid #ff5252;

    animation:pulsar .8s infinite alternate;

}


@keyframes pulsar{

from{

    box-shadow:0 0 5px red;

}

to{

    box-shadow:0 0 20px red;

}

}


</style>

</head>


<body>


<div class="container">


<h2>🏥 Triagem Frontier</h2>


<input id="nome" placeholder="Nome do Paciente">


<select id="sintoma">

<option value="">Selecione o sintoma</option>

<option value="dor_leve">Dor leve</option>

<option value="resfriado">Resfriado</option>

<option value="coriza">Coriza</option>

<option value="tosse">Tosse</option>

<option value="febre">Febre</option>

<option value="vomito">Vômito</option>

<option value="diarreia">Diarreia</option>

<option value="falta_ar_moderada">Falta de ar moderada</option>

<option value="falta_ar_grave">Falta de ar grave</option>

<option value="infarto">Suspeita de infarto</option>

<option value="avc">Suspeita de AVC</option>

<option value="convulsao">Convulsão</option>

<option value="hemorragia">Hemorragia</option>

</select>


<input 
id="temp"
type="number"
placeholder="Temperatura °C">


<input
id="alergia"
placeholder="Alergias">


<textarea
id="observacao"
placeholder="Observações médicas"></textarea>


<div id="resultado"></div>


<button onclick="salvar()">

Registrar Triagem

</button>


</div>



<script>


function classificarRisco(sintoma,temperatura){


const vermelhos=[

"infarto",
"avc",
"convulsao",
"hemorragia",
"falta_ar_grave"

];


const amarelos=[

"febre",
"vomito",
"diarreia",
"falta_ar_moderada"

];


if(temperatura>=39){

return "vermelho";

}


if(vermelhos.includes(sintoma)){

return "vermelho";

}


if(amarelos.includes(sintoma)){

return "amarelo";

}


return "verde";


}



function salvar(){


const nome=document.getElementById("nome").value;


const sintoma=document.getElementById("sintoma").value;


const temperatura=

Number(
document.getElementById("temp").value
);


const alergia=document.getElementById("alergia").value;


const observacao=document.getElementById("observacao").value;


const risco=

classificarRisco(
sintoma,
temperatura
);



fetch("http://localhost:3000/triagem",{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

nome,

sintoma,

temperatura,

alergia,

observacao,

risco

})

})


.then(r=>r.json())


.then(()=>{


const resultado=document.getElementById("resultado");


resultado.className=risco;


resultado.innerHTML=

"Classificação: "+

risco.toUpperCase();


alert("Triagem salva com sucesso");


});


}


</script>


</body>

</html>
