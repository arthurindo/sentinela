<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Triagem de Pacientes</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #172033;
    }

    .container {
      max-width: 1100px;
      margin: auto;
    }

    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-bottom: 22px;
    }

    h1 {
      color: #0f766e;
      margin-bottom: 5px;
    }

    h2 {
      margin-top: 0;
    }

    .painel {
      background: white;
      padding: 22px;
      border-radius: 14px;
      margin-bottom: 22px;
      box-shadow: 0 4px 18px #0f172a0d;
    }

    .campos {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 15px;
    }

    .campo {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .completo {
      grid-column: 1 / -1;
    }

    input, select, textarea {
      width: 100%;
      padding: 11px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      font: inherit;
    }

    textarea {
      min-height: 80px;
      resize: vertical;
    }

    button, .link {
      display: inline-block;
      padding: 11px 14px;
      border: none;
      border-radius: 8px;
      font: inherit;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
    }

    button:disabled {
      opacity: .6;
      cursor: wait;
    }

    .verde {
      background: #0f766e;
      color: white;
    }

    .laranja {
      background: #ea580c;
      color: white;
    }

    .cinza {
      background: #e2e8f0;
      color: #1e293b;
    }

    .acoes {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tabela-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      min-width: 700px;
      border-collapse: collapse;
    }

    th, td {
      padding: 13px 10px;
      text-align: left;
      border-bottom: 1px solid #e2e8f0;
    }

    th {
      background: #f8fafc;
    }

    .mensagem {
      white-space: pre-wrap;
      font-weight: bold;
    }

    .vazio {
      text-align: center;
      color: #64748b;
      padding: 20px;
    }

    @media (max-width: 650px) {
      body {
        padding: 12px;
      }

      .painel {
        padding: 15px;
      }

      .campos {
        grid-template-columns: 1fr;
      }

      .completo {
        grid-column: auto;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header>
      <div>
        <h1>Triagem de pacientes</h1>
        <p>Fila de espera e registro de triagem</p>
      </div>

      <div class="acoes">
        <a class="link cinza" href="/index.html">Voltar</a>
        <a class="link verde" href="/tv.html" target="_blank">Abrir TV</a>
      </div>
    </header>

    <section class="painel">
      <h2>Pacientes aguardando triagem</h2>
      <p id="mensagem-fila" class="mensagem" role="status"></p>

      <div class="tabela-wrap">
        <table>
          <thead>
            <tr>
              <th>Nome</th>
              <th>CPF</th>
              <th>Tipo</th>
              <th>Status</th>
              <th>Ações</th>
            </tr>
          </thead>

          <tbody id="fila-pacientes">
            <tr>
              <td colspan="5" class="vazio">Carregando pacientes...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </section>

    <section class="painel" id="painel-chamada-tv" hidden>
      <h2>Chamar paciente na TV</h2>
      <p id="paciente-chamada-nome" class="mensagem"></p>
      <div class="campos">
        <div class="campo">
          <label for="tv-local-tipo">Local de atendimento</label>
          <input id="tv-local-tipo" value="CONSULTÓRIO" required>
        </div>
        <div class="campo">
          <label for="tv-local-numero">Número do consultório</label>
          <input id="tv-local-numero" value="01" required>
        </div>
      </div>
      <br>
      <div class="acoes">
        <button class="laranja" type="button" id="tv-confirmar">Confirmar chamada</button>
        <button class="cinza" type="button" id="tv-cancelar">Cancelar</button>
      </div>
      <p id="tv-mensagem" class="mensagem" role="status"></p>
    </section>

    <section class="painel" id="painel-triagem">
      <h2>Registrar triagem</h2>
      <p id="resultado" class="mensagem" role="status"></p>

      <form id="form-triagem">
        <input type="hidden" id="pacienteId">

        <div class="campos">
          <div class="campo">
            <label for="nome">Nome do paciente</label>
            <input id="nome" required>
          </div>

          <div class="campo">
            <label for="cpf">CPF</label>
            <input id="cpf">
          </div>

          <div class="campo">
            <label for="sintoma">Sintomas / queixa</label>
            <textarea id="sintoma" required></textarea>
          </div>

          <div class="campo">
            <label for="temp">Temperatura (°C)</label>
            <input id="temp" type="number" step="0.1" min="25" max="45">
          </div>

          <div class="campo">
            <label for="alergia">Alergias</label>
            <input id="alergia">
          </div>

          <div class="campo">
            <label for="observacao">Observações</label>
            <textarea id="observacao"></textarea>
          </div>

          <div class="campo completo">
            <label for="classificacao">Classificação</label>
            <select id="classificacao">
              <option value="Verde - Pouco urgente">Verde - Pouco urgente</option>
              <option value="Amarelo - Urgente">Amarelo - Urgente</option>
              <option value="Laranja - Muito urgente">Laranja - Muito urgente</option>
              <option value="Vermelho - Emergência">Vermelho - Emergência</option>
            </select>
          </div>
        </div>

        <br>

        <div class="acoes">
          <button class="verde" type="submit" id="btn-salvar">
            Salvar triagem
          </button>

          <button class="cinza" type="button" id="btn-limpar">
            Limpar
          </button>
        </div>
      </form>
    </section>
  </main>

  <script>
    const fila = document.getElementById("fila-pacientes");
    const mensagemFila = document.getElementById("mensagem-fila");
    const formulario = document.getElementById("form-triagem");
    const resultado = document.getElementById("resultado");
    const btnSalvar = document.getElementById("btn-salvar");

    async function requisicao(url, opcoes = {}) {
      const resposta = await fetch(url, opcoes);
      const texto = await resposta.text();

      let dados;

      try {
        dados = texto ? JSON.parse(texto) : {};
      } catch {
        throw new Error(
          "Resposta inválida do servidor. Confirme que o site foi aberto por localhost:3000."
        );
      }

      if (!resposta.ok) {
        throw new Error(dados.erro || dados.mensagem || "Erro HTTP " + resposta.status);
      }

      return dados;
    }

    async function carregarPacientes() {
      try {
        const pacientes = await requisicao("/pacientes");

        if (!Array.isArray(pacientes)) {
          throw new Error("A rota /pacientes não retornou uma lista.");
        }

        fila.innerHTML = "";
        mensagemFila.textContent = "";

        const aguardando = pacientes.filter(p => {
          const status = String(p.status || "").toLowerCase();
          return ["triagem", "aguardando_triagem", ""].includes(status);
        });

        if (aguardando.length === 0) {
          const linha = document.createElement("tr");
          const celula = document.createElement("td");

          celula.colSpan = 5;
          celula.className = "vazio";
          celula.textContent = "Nenhum paciente aguardando triagem.";

          linha.appendChild(celula);
          fila.appendChild(linha);
          return;
        }

        aguardando.forEach(paciente => {
          const linha = document.createElement("tr");

          [paciente.nome || "Sem nome",
           paciente.cpf || "—",
           paciente.tipo || "Normal",
           paciente.status || "triagem"].forEach(valor => {
            const celula = document.createElement("td");
            celula.textContent = valor;
            linha.appendChild(celula);
          });

          const colunaAcoes = document.createElement("td");
          const acoes = document.createElement("div");
          acoes.className = "acoes";

          const btnTriar = document.createElement("button");
          btnTriar.type = "button";
          btnTriar.className = "verde";
          btnTriar.textContent = "Triar";
          btnTriar.addEventListener("click", () => selecionarPaciente(paciente));

          const btnTV = document.createElement("button");
          btnTV.type = "button";
          btnTV.className = "laranja";
          btnTV.textContent = "Chamar na TV";
          btnTV.addEventListener("click", () => chamarNaTV(paciente, btnTV));

          acoes.append(btnTriar, btnTV);
          colunaAcoes.appendChild(acoes);
          linha.appendChild(colunaAcoes);
          fila.appendChild(linha);
        });
      } catch (erro) {
        console.error("Erro ao carregar pacientes:", erro);
        mensagemFila.textContent = "Erro ao carregar fila: " + erro.message;
      }
    }

    function selecionarPaciente(paciente) {
      document.getElementById("pacienteId").value = paciente.id ?? "";
      document.getElementById("nome").value = paciente.nome || "";
      document.getElementById("cpf").value = paciente.cpf || "";

      document.getElementById("painel-triagem").scrollIntoView({
        behavior: "smooth"
      });
    }

    // CHAMADA NA TV SEM prompt(): usa campos na própria página
    let pacienteSelecionadoParaTV = null;
    const painelChamadaTV = document.getElementById("painel-chamada-tv");
    const mensagemTV = document.getElementById("tv-mensagem");
    const botaoConfirmarTV = document.getElementById("tv-confirmar");

    async function chamarNaTV(paciente, botao) {
      if (!paciente || !paciente.nome) {
        alert("Erro: paciente não identificado.");
        return;
      }

      pacienteSelecionadoParaTV = paciente;
      document.getElementById("paciente-chamada-nome").textContent =
        "Paciente: " + paciente.nome;
      document.getElementById("tv-local-tipo").value = "CONSULTÓRIO";
      document.getElementById("tv-local-numero").value = "01";
      mensagemTV.textContent = "";
      painelChamadaTV.hidden = false;
      painelChamadaTV.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    botaoConfirmarTV.addEventListener("click", async () => {
      if (!pacienteSelecionadoParaTV) {
        mensagemTV.textContent = "Selecione um paciente na fila.";
        return;
      }

      const localTipo = document.getElementById("tv-local-tipo").value.trim();
      const localNumero = document.getElementById("tv-local-numero").value.trim();

      if (!localTipo || !localNumero) {
        mensagemTV.textContent = "Preencha o local e o número do consultório.";
        return;
      }

      const textoOriginal = botaoConfirmarTV.textContent;
      botaoConfirmarTV.disabled = true;
      botaoConfirmarTV.textContent = "Enviando...";
      mensagemTV.textContent = "";

      try {
        const retorno = await requisicao("/tv/chamar", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            paciente: pacienteSelecionadoParaTV.nome,
            localTipo,
            localNumero
          })
        });

        mensagemTV.textContent =
          retorno.mensagem || "Paciente chamado na TV com sucesso!";
      } catch (erro) {
        console.error("Erro ao chamar na TV:", erro);
        mensagemTV.textContent = "Não foi possível chamar na TV: " + erro.message;
      } finally {
        botaoConfirmarTV.disabled = false;
        botaoConfirmarTV.textContent = textoOriginal;
      }
    });

    document.getElementById("tv-cancelar").addEventListener("click", () => {
      pacienteSelecionadoParaTV = null;
      painelChamadaTV.hidden = true;
      mensagemTV.textContent = "";
    });


    formulario.addEventListener("submit", async event => {
      event.preventDefault();

      resultado.textContent = "";
      btnSalvar.disabled = true;

      const dados = {
        pacienteId: document.getElementById("pacienteId").value || null,
        nome: document.getElementById("nome").value.trim(),
        cpf: document.getElementById("cpf").value.trim(),
        sintoma: document.getElementById("sintoma").value.trim(),
        temp: document.getElementById("temp").value,
        alergia: document.getElementById("alergia").value.trim(),
        observacao: document.getElementById("observacao").value.trim(),
        resultado: document.getElementById("classificacao").value
      };

      try {
        const retorno = await requisicao("/triagem", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify(dados)
        });

        resultado.textContent = retorno.mensagem || "Triagem salva com sucesso.";
        formulario.reset();
        document.getElementById("pacienteId").value = "";

        await carregarPacientes();
      } catch (erro) {
        resultado.textContent = "Erro ao salvar: " + erro.message;
        console.error(erro);
      } finally {
        btnSalvar.disabled = false;
      }
    });

    document.getElementById("btn-limpar").addEventListener("click", () => {
      formulario.reset();
      document.getElementById("pacienteId").value = "";
      resultado.textContent = "";
    });

    carregarPacientes();
  </script>
</body>
</html>
