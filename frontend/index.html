<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="./css/style.css">
</head>
<body>
<div class="container">
  <img src="./image/logo.png" alt="">
  <h2>🏥 Sistema Hospitalar</h2>
  <input id="usuario" placeholder="Usuário">
  <input id="senha" type="password" placeholder="Senha">
  <button onclick="login()">Entrar</button>
</div>

<script>
function login() {
  fetch("http://localhost:3000/login", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({
      usuario: usuario.value,
      senha: senha.value
    })
  })
  .then(r => r.json())
  .then(data => {
    if(data.tipo === "triagem") location.href = "triagem.html";
    if(data.tipo === "medico") location.href = "medico.html";
    if(data.tipo === "atendimento") location.href = "atendimento.html";
  });
}

// Atalho secreto: Ctrl + Shift + A
document.addEventListener("keydown", function(e) {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "a") {
        e.preventDefault();
        window.location.href = "./admin.html";
    }
});


</script>
</body>
</html>
