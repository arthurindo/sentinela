<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hospital Valentine</title>



<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{

    height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    font-family:'Cinzel',serif;

    background:
    linear-gradient(rgba(15,8,0,.75),rgba(15,8,0,.75)),
    url("https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=1600&q=80");

    background-size:cover;
    background-position:center;

    color:#f3d08d;

}

.container{

    width:430px;

    background:rgba(35,18,8,.92);

    border:3px solid #8b5a2b;

    border-radius:10px;

    padding:35px;

    text-align:center;

    box-shadow:
    0 0 35px rgba(0,0,0,.8),
    inset 0 0 20px rgba(255,190,80,.08);

}

.logo{

    width:120px;

    margin-bottom:20px;

    filter:drop-shadow(0 0 10px #000);

}

h1{

    font-size:32px;

    color:#f5d28d;

    text-shadow:3px 3px 5px black;

    letter-spacing:2px;

}

.subtitulo{

    margin:12px 0 28px;

    color:#d6b477;

    font-size:15px;

    letter-spacing:1px;

}

input{

    width:100%;

    padding:14px;

    margin-bottom:18px;

    background:#3b2415;

    color:#f6e0b1;

    border:2px solid #8b5a2b;

    border-radius:5px;

    outline:none;

    font-family:inherit;

    font-size:15px;

}

input::placeholder{

    color:#d8bf90;

}

input:focus{

    border-color:#d4af37;

    box-shadow:0 0 10px rgba(212,175,55,.5);

}

button{

    width:100%;

    padding:15px;

    border:none;

    border-radius:6px;

    background:linear-gradient(#d0a24b,#8b5a2b);

    color:#2d1808;

    font-size:18px;

    font-weight:bold;

    letter-spacing:2px;

    cursor:pointer;

    transition:.3s;

    font-family:inherit;

}

button:hover{

    transform:translateY(-2px);

    background:linear-gradient(#deb562,#9c6530);

    box-shadow:0 0 18px rgba(255,190,60,.45);

}

footer{

    margin-top:25px;

    font-size:12px;

    color:#9d8b6b;

}

</style>

</head>

<body>

<div class="container">

   

    <h1>Hospital Valentine</h1>

    <p class="subtitulo">
        Sistema Hospitalar do Velho Oeste
    </p>

    <input id="usuario" placeholder="Usuário">

    <input
        id="senha"
        type="password"
        placeholder="Senha">

    <button onclick="login()">
        Entrar
    </button>

    <footer>
        "Tenha sangue, tenha morte tenha redençao"
    </footer>

</div>

<script>

function login(){

fetch("http://localhost:3000/login",{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

usuario:usuario.value,
senha:senha.value

})

})

.then(r=>r.json())

.then(data=>{

if(data.tipo==="triagem")
location.href="triagem.html";

if(data.tipo==="medico")
location.href="medico.html";

if(data.tipo==="atendimento")
location.href="atendimento.html";

})

.catch(()=>{
alert("Erro ao conectar ao servidor.");
});

}

</script>

</body>
</html>
