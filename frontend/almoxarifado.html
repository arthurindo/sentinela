<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Almoxarifado | Hospital Pro</title>
    <link rel="stylesheet" href="css/almoxarifado.css">
</head>
<body>
    <header class="navbar">
        <div class="nav-brand">
            <div class="logo-icon">📦</div>
            <div>
    <h1>Hospital Pro - Almoxarifado</h1>
                <span>Gestao de Entrada de Controle de Estoque</span>
            </div>
        </div>
        <div class="nav-user">
            <span class="user-pill" id="nomeUsuario">📦 Almoxarifado</span>
            <a href="index.html" class="btn-nav">🚪Sair</a>
        </div>
    </header>
    
    <main class="conteiner">
        <!-- ALERTA -->
        <div class="alerta-estoque" id="alertaEstoque" style="display: none;">
            ⚠️ <strong>Atencão:</strong> <span id="alertaTexto"></span>
        </div>

        <!-- STATS -->
         <div class="stats-bar">
            <div class="stat-card">
                <div class="stat-icon purple">📦</div>
                <div>
                    <div class="stat-value" id="statItens">-</div>
                    <div class="stat-label">Tipos Cadastrados</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon-green">🟢</div>
                <div>
                    <div class="stat-value" id="statOk">-</div>
                    <div class="stat-label">Estoque Normal</div>
                </div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">⚠️</div>
                <div>
                    <div class="stat-value" id="statBaixo">-</div>
                    <div class="stat-label">Estoque Baixo (MENOR QUE 10 UN)</div>
                </div>
            </div> 
            <div class="stat-card">
                <div class="stat-icon red">⛔</div>
                <div>
                    <div class="stat-value" id="statZerado">-</div>
                    <div class="stat-label">Estoque Zerado</div>
                </div>
            </div>
        </div>
              <!--MAIN GRID-->
              <div class="main-grid">

                <!-- COLUNA ESQUERDA: FORMULARIO ENTRADA-->
                 <div>
                    <div class="card">
                        <div class="card-header">
                            <h2>📥 Entrada de Medicamentos</h2>
                        </div>
                        <div class="card-body">

                            <!--Tabs:Novo ou repor-->
                            <div class="entrada-tabs">
                            <button class="tab-btn active" id="tabNovo" onclick="setTab('novo')">➕ Novo Medicamento</button>
                            <button class="tab-btn" id="tabRepor" onclick="setTab('repor')">🔄 Repor Estoque</button>
                            </div>

                            <!--PAINEL:Cadastro Novo Medicamento-->
                            <div id="painelNovo">
                                <div class="form-group">
                                    <label for="emNome">Nome do Medicamento:</label>
                                    <input type="text" id="emNome" class="form-control"
                                     placeholder="Ex: Paracetamol 750mg"
                                     autocomplete="off">
                                </div>
                                <div class="form-group">
                                    <label for="emQtd">Quantidade
                                        <small>(unidades a adicionar)</small>:</label>
                                    <input type="number" id="emQtd" class="form-control"
                                    value="10" min="1">
                                </div>
                            <div class="form-group">
                                <label for="emUnidade">Unidade:</label>
                                <select id="emUnidade" class="form-control">
                                    <option value="comprimidos">Comprimidos</option>
                                    <option value="capsulas">Capsulas</option>
                                    <option value="frascos">Frascos</option>
                                    <option value="Ampolas">Ampolas</option>
                                    <option value="sachês">sachês</option>
                                    <option value="unidades">unidades</option>
                                </select>
                            </div>

                                <div class="form-group">
                                    <label for="emCategoria">Categoria
                                        Farmacológica:</label>
                                    <select id="emCategoria" class="form-control">
                                        <option value="Analgésico/Antipirético">
                                            Analgésico/
                                            Antipirético</option>
                                        <option value="Antibiótico">Antibiótico</option>
                                        <option value="Anti-inflamatório">Anti-inflamatório</option>
                                        <option value="Antialérgico">Antialérgico</option>
                                        <option value="Protetor Gastrico">Protetor Gastrico</option>
                                        <option value="Antiespamodico">Antiespamodico</option>
                                        <option value="Solução">Solução</option>
                                        <option value="vitamina/Suplemento">vitamina/Suplemento</option>
                                        <option value="Geral">Geral</option>
                                    </select>
                                </div>
                                <button class="btn-full btn-purple" onclick="darEntrada()">Registrar Entrada no Estoque</button>
                        </div>
                    </div>
                 </div>
              </div>
        </div>
    </main>
</body>
</html>
