
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuários</title>

    <link rel="stylesheet" href="/frontend/css/style.css">

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
        }

        .conteiner {
            width: 100%;
            max-width: 600px;
            margin: 30px auto;
            padding: 25px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h2, h3 {
            color: #2c3e50;
        }

        input, select, button {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 12px 0;
            border-radius: 6px;
            font-size: 15px;
        }

        input, select {
            border: 1px solid #ccc;
        }

        button {
            background: #3498db;
            color: white;
            border: none;
            cursor: pointer;
        }

        button:hover {
            background: #2980b9;
        }

        button:disabled {
            background: #95a5a6;
            cursor: not-allowed;
        }

        .card {
            margin: 10px 0;
            padding: 15px;
            background: #f4f7f9;
            border-left: 4px solid #3498db;
            border-radius: 6px;
            overflow-wrap: anywhere;
        }

        .mensagem {
            margin-top: 12px;
            color: #555;
            overflow-wrap: anywhere;
        }

        .erro {
            color: #c0392b;
        }
    </style>
</head>

<body>
    <div class="conteiner">

        <a href="index.html"
           style="text-decoration:none; color:#3498db; font-size:14px;">
            ← Voltar para o Login
        </a>

        <h2>👤 Cadastrar Usuário</h2>

        <form id="formUsuario">
            <input
                type="text"
                id="usuario"
                placeholder="Nome do usuário (login)"
                autocomplete="username"
                required
            >

            <input
                type="password"
                id="senha"
                placeholder="Senha"
                autocomplete="new-password"
                required
            >

            <select id="tipo" required>
                <option value="">Selecione o setor</option>
                <option value="atendimento">Atendimento</option>
                <option value="triagem">Triagem</option>
                <option value="medico">Médico</option>
            </select>

            <button type="submit" id="btnCadastrar">
                ➕ Cadastrar Usuário
            </button>
        </form>

        <div id="mensagem" class="mensagem" role="status"></div>

        <hr style="margin:20px 0; border:none; border-top:1px solid #ccc;">

        <h3>📑 Usuários Cadastrados</h3>

        <div id="listaUsuarios">
            Carregando usuários...
        </div>
    </div>

    <script>
        const form = document.getElementById("formUsuario");
        const campoUsuario = document.getElementById("usuario");
        const campoSenha = document.getElementById("senha");
        const campoTipo = document.getElementById("tipo");
        const botaoCadastrar = document.getElementById("btnCadastrar");
        const listaUsuarios = document.getElementById("listaUsuarios");
        const mensagem = document.getElementById("mensagem");

        // Endereço da API do servidor.
        // Se o site estiver sendo servido por outra porta,
        // ajuste este endereço para a porta do seu backend.
        const API_URL = "http://localhost:3000/usuarios";

        // Cadastrar usuário
        form.addEventListener("submit", async function(event) {
            event.preventDefault();

            const usuario = campoUsuario.value.trim();
            const senha = campoSenha.value;
            const tipo = campoTipo.value;

            if (!usuario || !senha || !tipo) {
                mensagem.textContent = "Preencha todos os campos.";
                mensagem.className = "mensagem erro";
                return;
            }

            botaoCadastrar.disabled = true;
            botaoCadastrar.textContent = "Cadastrando...";
            mensagem.textContent = "";

            try {
                const resposta = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify({
                        usuario: usuario,
                        senha: senha,
                        tipo: tipo
                    })
                });

                const dados = await resposta.json();

                if (!resposta.ok || dados.erro) {
                    throw new Error(
                        dados.erro || "Não foi possível cadastrar o usuário."
                    );
                }

                mensagem.textContent = "Usuário cadastrado com sucesso!";
                mensagem.className = "mensagem";

                form.reset();

                // Atualiza a lista depois de cadastrar.
                await carregarUsuarios();

            } catch (erro) {
                mensagem.textContent =
                    "Erro ao cadastrar: " + erro.message;
                mensagem.className = "mensagem erro";

                console.error("Erro no cadastro:", erro);

            } finally {
                botaoCadastrar.disabled = false;
                botaoCadastrar.textContent = "➕ Cadastrar Usuário";
            }
        });

        // Buscar e mostrar usuários cadastrados
        async function carregarUsuarios() {
            listaUsuarios.textContent = "Carregando usuários...";

            try {
                const resposta = await fetch(API_URL);

                if (!resposta.ok) {
                    throw new Error("Erro HTTP " + resposta.status);
                }

                const dados = await resposta.json();

                // Aceita tanto uma lista direta quanto { usuarios: [...] }.
                const usuarios = Array.isArray(dados)
                    ? dados
                    : dados.usuarios;

                if (!Array.isArray(usuarios)) {
                    throw new Error(
                        "O servidor não retornou uma lista de usuários."
                    );
                }

                listaUsuarios.innerHTML = "";

                if (usuarios.length === 0) {
                    listaUsuarios.textContent =
                        "Nenhum usuário cadastrado.";
                    return;
                }

                usuarios.forEach(function(u) {
                    const card = document.createElement("div");
                    card.className = "card";

                    const nome = document.createElement("p");
                    nome.textContent = "Usuário: " + u.usuario;

                    const setor = document.createElement("p");
                    setor.textContent = "Setor: " + u.tipo;

                    card.appendChild(nome);
                    card.appendChild(setor);

                    listaUsuarios.appendChild(card);
                });

            } catch (erro) {
                listaUsuarios.textContent =
                    "Não foi possível carregar os usuários. Verifique o servidor.";
                console.error("Erro ao carregar usuários:", erro);
            }
        }

        // Carregar a lista ao abrir a página.
        carregarUsuarios();
    </script>
</body>
</html>
